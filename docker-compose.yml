services:
  church-translation:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - church-auth-data:/app/data
      - church-source-logs:/app/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  church-auth-data:
  church-source-logs: