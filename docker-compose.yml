services:
  church-translation:
    image: church-translation:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        VCS_REF: ${VCS_REF:-local}
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ${APP_DATA_DIR:-./data}:/app/data
      - ${APP_LOG_DIR:-./log}:/app/log
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s